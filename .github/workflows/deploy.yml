name: Deploy to GitHub Pages

# Builds the React app and publishes dist/ via the Pages artifact API.
# The GITHUB_TOKEN gets the required pages write permission below, so no
# personal token or manual settings change is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Switch Pages from "legacy" (serve the main branch) to artifact
      # deployments produced by this workflow. Done via the REST API
      # because actions/configure-pages enablement does not always
      # flip an existing legacy configuration. The GITHUB_TOKEN has
      # pages:write via the `permissions` block above.
      - name: Enable Pages workflow deployment
        run: |
          curl -sSf -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
