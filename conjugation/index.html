<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konjugation · German Verb Trainer A1–C2</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
.cj-main{max-width:720px;margin:0 auto;padding:20px 16px 80px}
.cj-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:18px}
.cj-tab{flex:1;padding:12px 8px;text-align:center;font-weight:800;font-size:13px;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:3px solid transparent;transition:all .18s}
.cj-tab:hover{color:var(--ink)}
.cj-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.cj-tab .n{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.cj-count{font-size:13px;font-weight:800;color:var(--muted);font-family:ui-monospace,Menlo,monospace;text-align:center;margin:10px 0}
/* conjugation table */
.cj-table{width:100%;border-collapse:collapse;margin:14px 0;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-1)}
.cj-table th{background:var(--flag-black);color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;text-align:left}
.cj-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:16px;font-weight:700}
.cj-table td:first-child{font-weight:800;color:var(--muted);font-size:13px;width:100px;background:var(--gold-soft)}
.cj-table td .verb{font-size:18px}
/* color-coded endings */
.ending{display:inline-block;padding:1px 6px;border-radius:4px;font-size:13px;font-weight:800}
.end-e{background:#e8f7ef;color:#16a34a}
.end-st{background:#fff4d6;color:#8a6100}
.end-t{background:#e9edff;color:#3730a3}
.end-en{background:#f3e8ff;color:#7c3aed}
/* quiz */
.cj-quiz-q{font-size:17px;font-weight:800;text-align:center;margin:16px 0;padding:20px;background:var(--surface);border:2px solid var(--border);border-radius:16px;box-shadow:var(--shadow-1)}
.cj-quiz-q .verb{font-size:26px;color:var(--primary)}
.cj-quiz-q .person{font-size:14px;color:var(--muted);margin-bottom:6px}
.cj-quiz-q .tense{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-soft);border-radius:6px;padding:2px 12px;display:inline-block;margin-bottom:10px}
.cj-quiz-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:500px){.cj-quiz-opts{grid-template-columns:repeat(4,1fr)}}
.cj-input{width:100%;max-width:360px;margin:0 auto;display:block;border:2px solid var(--border);border-radius:12px;padding:12px 16px;font-size:18px;text-align:center;font-family:inherit}
.cj-input:focus{outline:none;border-color:var(--primary)}
/* level deck */
.cj-level{margin:16px 0}
.cj-level-head{display:flex;align-items:center;gap:12px;margin:20px 0 8px}
.cj-level-head .lv-badge{font-size:20px;font-weight:900;padding:6px 16px;border-radius:10px;color:#fff}
.cj-level-head h3{margin:0;flex:1;font-size:16px}
.cj-deck{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin:8px 0;cursor:pointer;transition:border-color .15s}
.cj-deck:hover{border-color:var(--primary)}
.cj-deck .dn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:800 13px ui-monospace,Menlo,monospace;color:#fff;flex:0 0 36px}
.cj-deck .dt{flex:1}
.cj-deck .dt b{font-size:15px}
.cj-deck .dt span{display:block;font-size:12px;color:var(--muted)}
.cj-deck .dp{font-size:11px;font-weight:800;color:var(--good)}
.type-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:5px;margin-left:6px;vertical-align:middle}
.cj-verb-item{display:flex;gap:10px;padding:8px 14px;border-top:1px solid var(--surface-3);cursor:pointer;font-size:14px}
.cj-verb-item:hover{background:var(--surface-2)}
.cj-verb-item .vi{font-weight:700;flex:1}
.cj-verb-item .vn{color:var(--muted);font-size:12px}
.cj-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.cj-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center}
.cj-stat .num{font-size:20px;font-weight:900;color:var(--primary)}
.cj-stat .lbl{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
@media(max-width:500px){.cj-stats{grid-template-columns:repeat(2,1fr)}}
.cj-filter{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cj-filter-btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:800;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.cj-filter-btn.active{border-color:var(--primary);color:var(--primary)}
</style>
</head>
<body>
<div class="topbar">
  <div class="row">
    <span class="lv-pill">KO</span>
    <div class="crumb"><b>Konjugation</b> · Verb Trainer A1–C2</div>
    <div class="row"><a class="btn btn-ghost btn-sm" href="../index.html">🏛️ Hub</a></div>
  </div>
</div>
<main class="cj-main" id="app"></main>

<script src="data.js"></script>
<script>
"use strict";
const S = JSON.parse(localStorage.getItem("conj_v2") || '{"known":[],"scores":[],"levelScores":{}}');
function save(){ localStorage.setItem("conj_v2", JSON.stringify(S)); }

const PRONOUNS = ["ich","du","er/sie/es","wir","ihr","sie/Sie"];
const KEYS = ["ich","du","er","wir","ihr","sie"];
const TENSES = [
  { key:"praesens", label:"Präsens", get:v=>v.praesens },
  { key:"praeteritum", label:"Präteritum", get:v=>v.praeteritum },
];

const app = document.getElementById("app");
let view = "home";
let currentLevel = "A1";
let currentType = null;
let selectedVerb = null;
let quizData = null, quizIdx = 0, quizScore = 0;
let quizLevel = "A1";

function nav(v){ view = v; selectedVerb = null; render(); window.scrollTo(0,0); }

function getVerbs(level, type) {
  let list = VERBS.filter(v => v.level === level);
  if(type) list = list.filter(v => v.type === type);
  return list;
}

function getTypeCounts(level) {
  const verbs = VERBS.filter(v => v.level === level);
  const counts = {};
  verbs.forEach(v => counts[v.type] = (counts[v.type]||0) + 1);
  return counts;
}

function render(){
  const views = {home:vHome, table:vTable, quiz:vQuiz};
  app.innerHTML = `
    <div class="cj-tabs">
      <button class="cj-tab ${view==='home'?'active':''}" onclick="nav('home')">Home<span class="n">${S.known.length}/${VERBS.length}</span></button>
      <button class="cj-tab ${view==='table'?'active':''}" onclick="nav('table')">Browse<span class="n">A1–C2</span></button>
      <button class="cj-tab ${view==='quiz'?'active':''}" onclick="nav('quiz')">Quiz<span class="n">MCQ</span></button>
    </div>
    <div id="content"></div>`;
  views[view]();
}

// ===== HOME =====
function vHome(){
  const c = document.getElementById("content");
  const known = S.known.length;
  const total = VERBS.length;

  let h = `<div class="cj-stats">
    <div class="cj-stat"><div class="num">${known}</div><div class="lbl">Mastered</div></div>
    <div class="cj-stat"><div class="num">${total}</div><div class="lbl">Total Verbs</div></div>
    <div class="cj-stat"><div class="num">${Object.keys(LEVELS).length}</div><div class="lbl">Levels</div></div>
    <div class="cj-stat"><div class="num">${S.scores.length}</div><div class="lbl">Quizzes</div></div>
  </div>`;

  // Level sections
  for(const [lvId, lv] of Object.entries(LEVELS)){
    const verbs = getVerbs(lvId);
    const k = verbs.filter(v=>S.known.includes(v.inf)).length;
    const types = getTypeCounts(lvId);
    h += `<div class="cj-level">
      <div class="cj-level-head">
        <span class="lv-badge" style="background:${lv.color}">${lvId}</span>
        <h3>${lv.name}</h3>
        <span class="small muted">${k}/${verbs.length}</span>
      </div>`;
    // Type sub-decks
    for(const [typeName, typeInfo] of Object.entries(TYPE_INFO)){
      const typeVerbs = verbs.filter(v=>v.type===typeName);
      if(!typeVerbs.length) continue;
      const tk = typeVerbs.filter(v=>S.known.includes(v.inf)).length;
      h += `<div class="cj-deck" onclick="currentLevel='${lvId}';currentType='${typeName}';view='table';selectedVerb=null;render()">
        <div class="dn" style="background:${typeInfo.color}">${typeVerbs.length}</div>
        <div class="dt"><b>${typeInfo.name}</b><span>${typeVerbs.length} verbs</span></div>
        <span class="dp">${tk}/${typeVerbs.length}</span>
      </div>`;
    }
    h += `</div>`;
  }

  // Quick quiz
  h += `<div class="card center"><h3>Quick Quiz</h3>
    <div class="cj-filter">
      ${Object.entries(LEVELS).map(([id,l])=>`<button class="cj-filter-btn" onclick="quizLevel='${id}';this.parentElement.querySelectorAll('.cj-filter-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${id}</button>`).join("")}
    </div>
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn btn-primary" onclick="startQuiz(10)">10 Questions</button>
      <button class="btn btn-good" onclick="startQuiz(20)">20 Questions</button>
    </div>
    ${S.scores.length ? `<p class="small muted" style="margin-top:12px">Recent: ${S.scores.slice(-3).map(s=>s+"%").join(", ")}</p>` : ""}
  </div>`;

  c.innerHTML = h;
}

// ===== TABLE VIEW =====
function vTable(){
  const c = document.getElementById("content");

  // Level tabs
  let h = `<div class="cj-filter">`;
  for(const [id, lv] of Object.entries(LEVELS)){
    h += `<button class="cj-filter-btn ${currentLevel===id?'active':''}" onclick="currentLevel='${id}';currentType=null;selectedVerb=null;render()">${id}</button>`;
  }
  h += `</div>`;

  const verbs = getVerbs(currentLevel, currentType);
  const lv = LEVELS[currentLevel];
  const typeName = currentType ? TYPE_INFO[currentType].name : "All";

  // If a verb is selected, show its table
  if(selectedVerb !== null){
    const v = verbs[selectedVerb];
    if(v){
      h = `<button class="btn btn-ghost btn-sm" style="margin-bottom:12px" onclick="selectedVerb=null;render()">← Back</button>`;
      h += `<div class="card">
        <h2 style="margin:0 0 4px">${v.inf}
          <span class="type-badge" style="background:${TYPE_INFO[v.type]?.color}20;color:${TYPE_INFO[v.type]?.color}">${v.type}</span>
        </h2>
        <p class="muted small" style="margin:0 0 4px">${v.en}</p>
        <span class="pill pill-lesson">${v.level}</span>
      </div>`;

      TENSES.forEach(tense=>{
        const forms = tense.get(v);
        h += `<div class="card"><h3>${tense.label}</h3><table class="cj-table">`;
        PRONOUNS.forEach((pron,pi)=>{
          const form = forms[KEYS[pi]];
          h += `<tr><td>${pron}</td><td class="verb">${colorEnd(form)}</td></tr>`;
        });
        h += `</table></div>`;
      });

      // Perfekt
      h += `<div class="card"><h3>Perfekt</h3><table class="cj-table">
        <tr><td>ich</td><td class="verb">${v.aux} ${v.partizip}</td></tr>
      </table></div>`;

      const isKnown = S.known.includes(v.inf);
      h += `<div class="center"><button class="btn ${isKnown?'btn-good':'btn-ghost'}" onclick="toggleKnown('${v.inf}')">${isKnown?'✓ Mastered':'Mark as mastered'}</button></div>`;
      c.innerHTML = h;
      return;
    }
  }

  // Show verb list
  h += `<div class="card"><h3>${currentLevel} · ${typeName} (${verbs.length})</h3><p class="small muted">Click a verb to see its conjugation</p>`;
  if(!currentType){
    // Show grouped by type
    for(const [tn, ti] of Object.entries(TYPE_INFO)){
      const tv = verbs.filter(v=>v.type===tn);
      if(!tv.length) continue;
      h += `<h4 style="margin:14px 0 6px;color:${ti.color}">${ti.name} (${tv.length})</h4>`;
      tv.forEach((v,i)=>{
        const globalIdx = verbs.indexOf(v);
        h += `<div class="cj-verb-item" onclick="selectedVerb=${globalIdx};render()">
          <span class="vi">${v.inf}</span>
          <span class="vn">${v.en}</span>
        </div>`;
      });
    }
  } else {
    verbs.forEach((v,i)=>{
      h += `<div class="cj-verb-item" onclick="selectedVerb=${i};render()">
        <span class="vi">${v.inf}</span>
        <span class="vn">${v.en}</span>
      </div>`;
    });
  }
  h += `</div>`;
  c.innerHTML = h;
}

function colorEnd(form){
  if(!form) return "";
  const endings = [{"e":"end-e","1":"end-e"},{"st":"end-st","t":"end-t"},{"en":"end-en"}];
  for(const pair of endings){
    const suffix = Object.keys(pair)[0];
    if(form.endsWith(suffix) && form.length > suffix.length){
      const stem = form.slice(0, -suffix.length);
      return `${stem}<span class="ending ${pair[suffix]}">${suffix}</span>`;
    }
  }
  return form;
}

function toggleKnown(inf){
  const i = S.known.indexOf(inf);
  if(i>=0) S.known.splice(i,1); else S.known.push(inf);
  save(); render();
}

// ===== QUIZ =====
function vQuiz(){
  const c = document.getElementById("content");
  if(!quizData){
    c.innerHTML = `<div class="card center" style="padding:40px">
      <h2>🧠 Konjugation Quiz</h2>
      <p class="muted">Choose a level, then start</p>
      <div class="cj-filter" style="justify-content:center;margin:14px 0">
        ${Object.entries(LEVELS).map(([id,l])=>`<button class="cj-filter-btn ${quizLevel===id?'active':''}" onclick="quizLevel='${id}';render()">${id}</button>`).join("")}
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn btn-primary" onclick="startQuiz(10)">10 Questions</button>
        <button class="btn btn-good" onclick="startQuiz(20)">20</button>
      </div>
    </div>`;
    return;
  }

  if(quizIdx >= quizData.length){
    const pct = Math.round(quizScore/quizData.length*100);
    S.scores.push(pct);
    if(!S.levelScores[quizLevel]) S.levelScores[quizLevel]=[];
    S.levelScores[quizLevel].push(pct);
    save();
    quizData = null;
    c.innerHTML = `<div class="card results-hero">
      <div class="stars">${pct>=90?"★★★":pct>=70?"★★☆":pct>=50?"★☆☆":"☆☆☆"}</div>
      <div class="results-score">${pct}%</div>
      <p class="muted">Quiz · ${quizLevel} · ${quizScore}/${quizIdx} correct</p>
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="btn btn-primary" onclick="render()">New Quiz</button>
      </div></div>`;
    return;
  }

  const q = quizData[quizIdx];
  c.innerHTML = `
    <div class="cj-count">Question ${quizIdx+1}/${quizData.length} · Score: ${quizScore}</div>
    <div class="cj-quiz-q">
      <span class="tense">${q.tenseLabel}</span>
      <div class="person">${q.person}</div>
      <div class="verb">${q.verb}</div>
    </div>
    <div id="qarea"></div>`;
  renderQ(q);
}

function renderQ(q){
  const area = document.getElementById("qarea");
  if(q.type === "mcq"){
    area.innerHTML = `
      <div class="cj-quiz-opts">
        ${q.opts.map((o,i)=>`<button class="opt" onclick="answerQ(${i})"><span class="k">${"abcd"[i]}</span>${o}</button>`).join("")}
      </div><div id="qfb"></div>`;
  } else {
    area.innerHTML = `
      <input class="cj-input" type="text" placeholder="Deine Antwort …" id="qin" autocomplete="off">
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn btn-primary" onclick="checkInput()">Check</button>
      </div><div id="qfb"></div>`;
    const inp = document.getElementById("qin");
    inp.focus();
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")checkInput();});
  }
  window._q = q;
}

function checkInput(){
  const inp = document.getElementById("qin");
  const val = inp.value.trim().toLowerCase();
  const q = window._q;
  handleAnswer(val === q.answer.toLowerCase(), q);
}

function answerQ(idx){
  const q = window._q;
  document.querySelectorAll(".opt").forEach((o,j)=>{
    o.style.pointerEvents="none";
    if(j === q.answer) o.classList.add("correct");
    if(j === idx && idx !== q.answer) o.classList.add("wrong");
  });
  handleAnswer(idx === q.answer, q);
}

function handleAnswer(ok, q){
  if(ok){
    quizScore++;
    if(!S.known.includes(q.verb)) S.known.push(q.verb);
    save();
  }
  const fb = document.getElementById("qfb");
  fb.innerHTML = `<div class="feedback ${ok?"ok":"bad"}" style="margin-top:14px">
    <div class="fb-title">${ok?"✓ Richtig!":"✗ Nicht ganz."}</div>
    ${!ok?`<div class="fb-correct">Richtig: <u>${q.display}</u></div>`:""}
    ${q.expl?`<div class="fb-expl">${q.expl}</div>`:""}
  </div>
  <div class="row" style="justify-content:center;margin-top:14px">
    <button class="btn btn-primary btn-sm" onclick="quizIdx++;render()">Next →</button>
  </div>`;
}

function startQuiz(n){
  const pool = VERBS.filter(v => v.level === quizLevel).slice();
  quizData = [];
  for(let i=0; i<n && pool.length; i++){
    const v = pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const tense = TENSES[Math.floor(Math.random()*2)];
    const pi = Math.floor(Math.random()*6);
    const answer = tense.get(v)[KEYS[pi]];
    if(!answer) continue;
    const isMCQ = Math.random() < 0.6;

    if(isMCQ){
      const distract = pool.filter(x=>x.inf!==v.inf).sort(()=>Math.random()-.5).slice(0,3)
        .map(x=>tense.get(x)[KEYS[pi]]).filter(x=>x && x!==answer);
      while(distract.length<3) distract.push(answer+"e");
      const opts = [answer,...distract].sort(()=>Math.random()-.5);
      quizData.push({type:"mcq",verb:v.inf,person:PRONOUNS[pi],tenseLabel:tense.label,
        opts,answer:opts.indexOf(answer),display:answer,expl:`${v.inf} = ${v.en} · ${tense.label}`});
    } else {
      quizData.push({type:"input",verb:v.inf,person:PRONOUNS[pi],tenseLabel:tense.label,
        answer,display:answer,expl:`${v.inf} = ${v.en} · ${tense.label}`});
    }
  }
  quizIdx=0;quizScore=0;
  render();
}

render();
</script>
</body>
</html>
