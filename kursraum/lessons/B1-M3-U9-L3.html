let deVoice=null;
function pickVoice(){ if(!("speechSynthesis" in window))return; deVoice=speechSynthesis.getVoices().find(v=>/^de/i.test(v.lang))||null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(t,r){ if(!("speechSynthesis" in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="de-DE"; u.rate=r||0.92; if(deVoice)u.voice=deVoice; speechSynthesis.speak(u); }
function sayAll(ts){ if(!("speechSynthesis" in window))return; speechSynthesis.cancel(); ts.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=0.87;if(deVoice)u.voice=deVoice;speechSynthesis.speak(u);}); }
function sayBtns(t){ return '<button class="speak-btn" data-say="'+esc(t)+'">🔊</button><button class="speak-btn slow" data-say="'+esc(t)+'" data-rate="0.68">0.7×</button>'; }
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]"); if(b) say(b.dataset.say,b.dataset.rate?parseFloat(b.dataset.rate):undefined);});
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function norm(s){return String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[.,!?;:„“"'´`()\[\]]/g," ").replace(/-/g," ").replace(/\s+/g," ").trim();}
function artColor(s){return String(s).replace(/\b(der|die|das)\b/g,m=>'<span class="art-'+m.toLowerCase()+'">'+m+'</span>');}

const host = document.getElementById("stephost");
const STEPS = [];
STEPS.push({ty:"intro"});
if(L.dialogue&&L.dialogue.length) STEPS.push({ty:"dialogue"});
if(L.vocab.length) STEPS.push({ty:"vocab"});

if((L.exs&&((L.exs.fills&&L.exs.fills.length)||(L.exs.corrections&&L.exs.corrections.length)))) STEPS.push({ty:"exs"});

if(L.listen&&L.listen.length) STEPS.push({ty:"listen"});

if(L.speak) STEPS.push({ty:"speak"});
if(L.write) STEPS.push({ty:"write"});
if(L.quiz&&L.quiz.length) STEPS.push({ty:"quiz"});
STEPS.push({ty:"results"});

let cur=0, stepDone=true, runResults=[], quizRes=null;

function render(){
  const st=STEPS[cur];
  stepDone = !["exs","quiz","listen","vocab"].includes(st.ty);
  document.getElementById("stepcount").textContent=T("step")+(cur+1)+" / "+STEPS.length+" · "+Math.round(cur/(STEPS.length-1)*100)+"%";
  document.getElementById("pbar").style.width=Math.round(cur/(STEPS.length-1)*100)+"%";
  host.innerHTML="";
  const nav=document.createElement("div"); nav.className="nav-btns";
  nav.innerHTML=(cur>0?'<button class="btn btn-ghost" data-nav="back">'+T("back")+'</button>':'<span></span>')+
    '<button class="btn btn-primary" data-nav="next" '+(stepDone?"":"disabled")+'>'+T("next")+'</button>';
  const box=document.createElement("div"); box.id="sbox"; host.appendChild(box);
  nav.querySelector('[data-nav="back"]')?.addEventListener("click",()=>{cur--;render();window.scrollTo(0,0);});
  nav.querySelector('[data-nav="next"]').addEventListener("click",()=>{ if(!stepDone)return; if(cur<STEPS.length-1){cur++;render();window.scrollTo(0,0);} });
  host.appendChild(nav);
  R[st.ty](box);
  window.scrollTo(0,0);
}

 document.getElementById("wm").onclick=()=>{document.getElementById("wbox").style.display="block";}; },

quiz(b){ b.innerHTML='<div class="steptitle">'+"Quiz"+'</div><div class="card"><p class="small muted">'+T("quizIntro")+'</p><div id="qrun"></div></div>';
 runItems(document.getElementById("qrun"),L.quiz.map(x=>({t:"mcq",x})),res=>{quizRes=res;runResults.push(res);stepDone=true;
  document.getElementById("qrun").innerHTML+='<p class="center" style="margin-top:10px"><b>Quiz: '+res.correct+' / '+res.total+'</b>'+(res.correct>=4?' — '+T('passed'):' — '+T('repeat'))+'</p>';}); },

results(b){ const all=runResults; const tot=all.reduce((a,r)=>a+r.total,0), cor=all.reduce((a,r)=>a+r.correct,0);
 const pct=tot?Math.round(cor/tot*100):0; const stars=pct>=90?"★★★":pct>=75?"★★☆":pct>=60?"★☆☆":"☆☆☆";
 let h='<div class="steptitle">'+T("results")+'</div><div class="card results-hero"><div class="stars">'+stars+'</div><div class="results-score">'+pct+'%</div><div class="muted">'+cor+' von '+tot+' '+T('tasksRight')+(quizRes?' · Quiz '+quizRes.correct+'/'+quizRes.total:'')+'</div></div>';
 const wrongs=all.flatMap(r=>r.items||[]).filter(x=>!x.ok);
 if(wrongs.length) h+='<div class="card"><h3>'+T("yourMistakes")+'</h3>'+wrongs.map(w=>'<div class="res-item bad"><span><b>✗</b></span><div>'+esc(w.q)+'<div class="small">'+T("correctLbl")+'<b>'+esc(w.a)+'</b></div></div></div>').join("")+'</div>';
 if(L.vocab.length){ h+='<div class="card"><h3>'+T("flip")+'</h3><div class="fc-deck">';
  L.vocab.forEach((v,j)=>{ const front=v[1]?artColor(v[0].split(" ")[0]+" ___ "+esc(v[0].split(" ").slice(1).join(" "))):esc(v[2]);
   const back=artColor(esc(v[0]))+(v[1]?' <span class="muted">· '+artColor(esc(v[1]))+'</span>':'')+' <span class="muted">· '+esc(v[2])+'</span>';
   h+='<div class="fcflip"><input type="checkbox" id="rf'+j+'"><label for="rf'+j+'"><div class="inner"><div class="face front"><div class="s">'+(v[1]?"Artikel + Plural":"Bedeutung")+'</div><div class="t">'+front+'</div></div><div class="face back"><div class="s">Antwort</div><div class="t">'+back+'</div></div></div></label></div>'; });
  h+='</div><p class="fc-hint">'+T("printHint")+'</p></div>'; }
 if(L.fun) h+='<div class="card"><div class="riddle-box">🧩 <b>'+L.fun.riddle[0]+'</b><details class="akey" style="margin-top:8px"><summary>Lösung anzeigen</summary>'+L.fun.riddle[1]+'</details></div>'+
  '<div class="kultur-box">🇩🇪 <b>Kulturtipp:</b> '+L.fun.culture+'</div><div class="challenge-box">🎯 <b>'+L.fun.challenge+'</b></div></div>';
 h+='<div class="card"><h3>'+T("reviewPlan")+'</h3><div class="schedule">'+T("schedule")+'</div>'+
  (L.ext?'<h3>'+T("extPr")+'</h3><div class="pron-tip">'+L.ext+'</div>':'')+
  '<h3>'+T("nextStep")+'</h3><p class="small">'+(L.isReview?T('unitNote'):(L.next?'➡️ <b>'+L.next.id+' · '+esc(L.next.title)+'</b>'+T('sayNext'):'Modul-Review nächste Session.'))+'</p>'+
  (L.nextId?'<a class="btn btn-primary btn-sm" href="'+L.nextId+'" style="margin-top:6px">'+T("directNext")+'</a>':'')+'</div>'+
  '<div class="foot-note">'+T("questions")+'</div>';
 b.innerHTML=h; }
};

function runItems(box,items,onDone){
 let i=0; const res=[];
 const q=()=>{ if(i>=items.length){onDone({total:res.length,correct:res.filter(r=>r.ok).length,items:res});return;}
  const it=items[i]; let h='<div class="excount">Aufgabe '+(i+1)+' / '+items.length+'</div>';
  if(it.t==="mcq"||it.t==="listen"){ const x=it.x||it.f; const o=(it.t==="listen")?it.x[2]:it.f[1]; const qtxt=(it.t==="listen")?it.x[1]:it.f[0];
   if(it.t==="listen") h+='<div class="row" style="margin-bottom:10px">'+sayBtns(it.x[0])+'</div>';
   h+='<div class="ex-q">'+qtxt+'</div><div class="opt-list">'+o.map((op,j)=>'<button class="opt" data-o="'+j+'"><span class="k">'+"abcd"[j]+'</span>'+esc(op)+'</button>').join("")+'</div>';
   h+='<div class="row" style="margin-top:12px"><button class="btn btn-primary btn-sm" data-chk>'+T("check")+'</button></div><div id="fb"></div>';
   box.innerHTML=h;
   box.querySelectorAll(".opt").forEach(op=>op.addEventListener("click",()=>{box.querySelectorAll(".opt").forEach(x2=>x2.classList.remove("sel"));op.classList.add("sel");}));
   const correct=(it.t==="listen")?it.x[3]:it.f[2];
   box.querySelector("[data-chk]").onclick=()=>chk(o,correct,(it.t==="listen")?it.x[4]:it.f[3],v=>o[v]);
  } else { const x=it.t==="fill"?it.f:it.c;
   const pre=it.t==="fill"?x[0]:""; const post=it.t==="fill"?(x[1]||""):"";
   h+='<div class="ex-q">'+(it.t==="fill"?esc(pre)+'<span style="border-bottom:2px solid var(--ink);padding:0 12px"></span>'+esc(post):(x[2]?'<span class="hint">'+x[2]+'</span>':'')+'Korrigiere: <b>'+esc(x[0])+'</b>')+(x[3]?'<span class="hint">Hinweis: '+x[3]+'</span>':'')+'</div>'+
   '<input class="ex-input" type="text" autocomplete="off" spellcheck="false" placeholder="'+T("answerPh")+'"><div class="row" style="margin-top:12px"><button class="btn btn-primary btn-sm" data-chk>'+T("check")+'</button></div><div id="fb"></div>';
   box.innerHTML=h;
   const inp=box.querySelector(".ex-input"); inp.focus(); inp.addEventListener("keydown",e=>{if(e.key==="Enter")box.querySelector("[data-chk]").click();});
   const accepts=it.t==="fill"?[x[2]]:x[1];
   const correctDisp=it.t==="fill"?x[2]:x[1][0];
   box.querySelector("[data-chk]").onclick=()=>{ const ok=accepts.some(a=>norm(a)===norm(inp.value));
    mark(ok,correctDisp,x[4]||x[3],inp.value);
    box.querySelectorAll(".opt").forEach((op,j)=>{}); };
  }
  function mark(ok,correctDisp,expl,user){ if(!mark._f){mark._f=true;res.push({ok,q:(box.querySelector(".ex-q")||{}).textContent||"",a:correctDisp});}
   const fb=box.querySelector("#fb");
   fb.innerHTML='<div class="feedback '+(ok?"ok":"bad")+'"><div class="fb-title">'+(ok?"✓ Richtig!":"✗ Nicht ganz.")+'</div>'+
    (ok?"":'<div class="fb-correct">'+T("rightIs")+'<u>'+esc(correctDisp)+'</u></div><div class="fb-expl">'+T("youWrote")+'<i>'+esc(String(user))+'</i></div>')+
    (expl?'<div class="fb-expl">'+expl+'</div>':'')+
    '<div class="fb-actions">'+(ok?'':'<button class="btn btn-ghost btn-sm" data-rt>'+T("tryAgain")+'</button>')+'<button class="btn btn-primary btn-sm" data-nx>Weiter →</button></div></div>';
   fb.querySelector("[data-rt]")?.addEventListener("click",()=>{fb.innerHTML="";mark._f=true;const inp=box.querySelector(".ex-input");if(inp){inp.value="";inp.focus();}});
   fb.querySelector("[data-nx]").addEventListener("click",()=>{i++;q();}); }
  function chk(o,correct,expl,dsp){ const sel=box.querySelector(".opt.sel"); if(!sel)return; const v=Number(sel.dataset.o); const ok=v===correct;
   box.querySelectorAll(".opt").forEach((op,j)=>{op.style.pointerEvents="none"; if(j===correct)op.classList.add("correct"); if(j===v&&!ok)op.classList.add("wrong");});
   mark(ok,dsp(v),expl,dsp(v)); } };
 q();
}

const _pill=document.getElementById("lvlPill");
if(_pill){ _pill.textContent=(L.level||"").split(" ")[0]; }
document.addEventListener("keydown",e=>{
  const t=e.target&&e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
  const opts=[...document.querySelectorAll(".opt")];
  if(/^[1-4]$/.test(e.key)&&opts.length){const o=opts[Number(e.key)-1];if(o&&o.style.pointerEvents!=="none"){document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));o.classList.add("sel");}return;}
  if(e.key==="Enter"){const b=document.querySelector("[data-chk]");if(b&&!b.disabled)b.click();}
});
render();
</script>
